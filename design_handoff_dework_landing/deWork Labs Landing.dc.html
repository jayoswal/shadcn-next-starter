<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body { margin: 0; }
</style>
</helmet>
<div style="width:382px;font-family:'Outfit',sans-serif;background:oklch(99% 0.003 240);overflow:hidden;position:relative;">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:22px 22px 0 22px;">
    <span style="font-size:16px;font-weight:600;color:oklch(18% 0.01 240);">deWork Labs</span>
    <button style="font-family:'Outfit',sans-serif;font-size:14px;font-weight:500;color:oklch(18% 0.01 240);background:transparent;border:1.5px solid oklch(18% 0.01 240);border-radius:999px;padding:8px 18px;cursor:pointer;">Book a call</button>
  </div>

  <div style="padding:34px 24px 0 24px;text-align:center;">
    <h1 style="margin:0;font-size:26px;font-weight:600;color:oklch(18% 0.01 240);letter-spacing:-0.01em;">AI Voice Calling Agents</h1>
    <p style="margin:12px 0 0 0;font-size:15px;font-weight:400;color:oklch(45% 0.01 240);">Talk to our agents in:</p>
  </div>

  <div style="margin:22px 0 0 0;padding:16px 0;position:relative;overflow:hidden;">
    <div style="position:relative;height:40px;width:100%;overflow:hidden;">
      <div style="position:absolute;top:50%;left:0;right:calc(50% + 30px);height:40px;transform:translateY(-50%);overflow:hidden;mask-image:linear-gradient(to right, transparent 0, black 20px, black 100%);-webkit-mask-image:linear-gradient(to right, transparent 0, black 20px, black 100%);">
        <div style="position:relative;height:100%;width:100%;">
          <sc-for list="{{leftBars}}" as="b" hint-placeholder-count="24">
            <span style="position:absolute;left:{{b.x}}px;top:50%;width:4px;border-radius:999px;background:#7CCF00;height:{{b.h}}%;transform:translateY(-50%) scale(1, {{b.s}});"></span>
          </sc-for>
        </div>
      </div>
      <div style="position:absolute;top:50%;left:calc(50% + 30px);right:0;height:40px;transform:translateY(-50%);overflow:hidden;mask-image:linear-gradient(to right, black 0, black calc(100% - 20px), transparent 100%);-webkit-mask-image:linear-gradient(to right, black 0, black calc(100% - 20px), transparent 100%);">
        <div style="position:relative;height:100%;width:100%;">
          <sc-for list="{{rightBars}}" as="b" hint-placeholder-count="24">
            <span style="position:absolute;left:{{b.x}}px;top:50%;width:4px;border-radius:999px;background:#7CCF00;height:{{b.h}}%;transform:translateY(-50%) scale(1, {{b.s}});"></span>
          </sc-for>
        </div>
      </div>
      <div style="pointer-events:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;">
        <div style="height:40px;min-width:104px;border-radius:20px;box-shadow:inset 0 0 0 1.5px oklch(55% 0.1 220);background:oklch(99% 0.003 240);display:flex;align-items:center;justify-content:center;padding:0 18px;box-sizing:border-box;">
          <span style="display:inline-block;transform:scaleX({{wordScaleX}});opacity:{{wordOpacity}};transform-origin:center;font-size:14px;font-weight:600;color:oklch(35% 0.09 220);white-space:nowrap;">{{word}}</span>
        </div>
      </div>
    </div>
  </div>

  <div style="padding:22px 24px 34px 24px;">
    <div style="display:flex;align-items:center;gap:10px;border:1.5px solid oklch(18% 0.01 240);border-radius:999px;padding:8px 10px 8px 14px;">
      <div style="display:flex;align-items:center;gap:4px;padding-right:10px;border-right:1px solid oklch(85% 0.01 240);">
        <svg width="20" height="14" viewBox="0 0 20 14" style="border-radius:2px;flex-shrink:0;"><rect width="20" height="14" fill="#fff"></rect><rect width="20" height="4.67" fill="#FF9933"></rect><rect width="20" height="4.67" y="9.33" fill="#138808"></rect><circle cx="10" cy="7" r="2" fill="none" stroke="#000080" stroke-width="0.4"></circle></svg>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="oklch(45% 0.01 240)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M6 9l6 6 6-6"></path></svg>
      </div>
      <input type="tel" placeholder="9876543210" style="flex:1;border:none;outline:none;font-family:'Outfit',sans-serif;font-size:15px;color:oklch(18% 0.01 240);background:transparent;min-width:0;">
      <button style="width:36px;height:36px;flex-shrink:0;border-radius:999px;border:none;background:oklch(58% 0.1 220);display:flex;align-items:center;justify-content:center;cursor:pointer;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M15 9l6 -6"></path><path d="M21 8v-5h-5"></path><path d="M6.279 10.71a13.007 13.007 0 0 0 6.712 7.01a1.66 1.66 0 0 0 1.63 -.163l1.66 -1.055a1.7 1.7 0 0 1 1.85 0l3.028 1.892a1.694 1.694 0 0 1 .11 2.81a9.699 9.699 0 0 1 -12.552 -.892c-2.973 -2.973 -4.911 -6.911 -5.911 -12.552a1.694 1.694 0 0 1 2.81 .11l1.892 3.028a1.7 1.7 0 0 1 0 1.85l-1.056 1.66a1.66 1.66 0 0 0 -.163 1.302"></path></svg>
      </button>
    </div>
  </div>

  <svg viewBox="0 0 382 30" width="382" height="30" style="display:block;filter:drop-shadow(0 -8px 10px oklch(18% 0.01 240 / 0.15));">
    <path d="M0,30 Q191,0 382,30" fill="none" stroke="oklch(18% 0.01 240)" stroke-width="1.5"></path>
  </svg>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 382, &quot;height&quot;: 660}}">
class Component extends DCLogic {
  languages = ['اردو', 'हिन्दी', 'বাংলা', 'தமிழ்', 'తెలుగు', 'मराठी', 'ਪੰਜਾਬੀ', 'ગુજરાતી', 'ಕನ್ನಡ', 'മലയാളം'];
  cycleMs = 1100;

  componentDidMount() {
    this.startTime = performance.now();
    const loop = () => {
      this.forceUpdate();
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  }

  componentWillUnmount() {
    if (this.raf) cancelAnimationFrame(this.raf);
  }

  smoothstep(e0, e1, x) {
    const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
    return t * t * (3 - 2 * t);
  }

  buildTrack(offset, trackWidth, pillEdge) {
    const step = 9;
    const numSlots = Math.ceil(trackWidth / step) + 4;
    const patternLength = numSlots * step;
    const squeezeZone = 20;
    const bars = [];
    for (let i = 0; i < numSlots; i++) {
      const x = ((i * step + offset) % patternLength) - step;
      const h = 22 + Math.abs(Math.sin(i * 0.9) * 55) + Math.abs(Math.sin(i * 2.1)) * 23;
      const dist = pillEdge === 'right' ? (trackWidth - x) : x;
      const f = this.smoothstep(0, squeezeZone, dist);
      const s = 0.1 + 0.9 * f;
      bars.push({ x: Math.round(x * 10) / 10, h: Math.round(Math.min(100, h)), s: Math.round(s * 100) / 100 });
    }
    return bars;
  }

  renderVals() {
    const elapsed = this.startTime ? performance.now() - this.startTime : 0;
    const trackWidth = 148;
    const scrollOffset = (elapsed / 1000) * 20;
    const leftBars = this.buildTrack(scrollOffset, trackWidth, 'right');
    const rightBars = this.buildTrack(scrollOffset, trackWidth, 'left');

    const t = (elapsed % this.cycleMs) / this.cycleMs;
    const index = Math.floor(elapsed / this.cycleMs) % this.languages.length;

    let envelope;
    if (t < 0.18) {
      const p = t / 0.18;
      envelope = p * p * (3 - 2 * p);
    } else if (t > 0.82) {
      const p = (t - 0.82) / 0.18;
      envelope = 1 - p * p * (3 - 2 * p);
    } else {
      envelope = 1;
    }

    return {
      leftBars,
      rightBars,
      word: this.languages[index],
      wordScaleX: Math.max(0.02, envelope),
      wordOpacity: envelope
    };
  }
}
</script>
</body>
</html>
